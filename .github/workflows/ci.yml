# Automatic checks (CI): runs on every pull request and every push to main.
# 1. Installs the exact package versions from package-lock.json
# 2. Runs all tests (npm test)
# 3. Builds the site (npm run build), exactly as Vercel does
# If any step fails, the pull request gets a red cross instead of a green tick.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build reads the stock from Supabase. Only the public, read-only key is needed.
          # Both are stored as repository secrets: Settings → Secrets and variables → Actions.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
